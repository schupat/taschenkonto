name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taschenkonto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/taschenkonto_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The scheduler works in local time. Runners are UTC, so a second pass in
      # a shifted zone catches expectations that silently assume one timezone.
      - run: npm test
        env:
          TZ: Pacific/Kiritimati

      - run: npx prisma migrate deploy

      - run: npm run test:db

      - run: npm run test:db
        env:
          TZ: Pacific/Kiritimati

      - run: npm run audit
